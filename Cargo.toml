[package]
name = "gdl90-emulator"
version = "0.1.0"
edition = "2021"
description = "GDL 90 ADS-B receiver emulator: drives an EFB over Wi-Fi as if it were flying"
publish = false

[[bin]]
name = "gdl90-emu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
if-addrs = "0.13"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Networking",
    "Networking_Connectivity",
    "Networking_NetworkOperators",
    "Devices_WiFi",
    "Win32_System_Com",
] }

[profile.release]
opt-level = 3
lto = "thin"
